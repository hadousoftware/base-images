version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /core/base
    schedule:
      interval: daily
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /core/python
    schedule:
      interval: daily
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /core/node
    schedule:
      interval: daily
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /core/bun
    schedule:
      interval: daily
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /core/terraform
    schedule:
      interval: daily
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /core/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
