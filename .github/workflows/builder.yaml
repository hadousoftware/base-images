name: Validate base images
on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install signed distribution test tools
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y --no-install-recommends python3-yaml shellcheck jq
      - name: Unit and policy tests
        run: |
          make test
          shellcheck scripts/*.sh
          bash scripts/lint_workflows.sh
      - name: Scan maintained source and workflow configuration
        run: python3 scripts/scan.py source . --output out/source-security
      - name: Retain source scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-security
          path: out/source-security/
          retention-days: 14
          if-no-files-found: warn

  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: catalog
        name: Create architecture matrix from reviewed catalog
        run: echo "matrix=$(python3 scripts/catalog.py matrix --architectures)" >> "$GITHUB_OUTPUT"

  image:
    name: ${{ matrix.name }}-${{ matrix.arch }}
    needs: [policy, catalog]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build current packages on the pinned upstream
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          docker build --pull --no-cache --platform "linux/${{ matrix.arch }}" \
            -f "${{ matrix.dockerfile }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPOSITORY" \
            -t hadou-base-images:test .
          test "$(docker inspect --format '{{.Architecture}}' hadou-base-images:test)" = '${{ matrix.arch }}'
      - name: Exercise restricted runtime
        run: bash scripts/container_smoke.sh hadou-base-images:test '${{ matrix.name }}'
      - name: Save the exact image for scanning and release
        run: |
          mkdir -p out/oci
          docker save hadou-base-images:test -o out/oci/image.tar
          sha256sum out/oci/image.tar > out/oci/image.tar.sha256
      - name: CVE gate and CycloneDX SBOM
        run: python3 scripts/scan.py image out/oci/image.tar --profile '${{ matrix.profile }}' --output out/oci/security
      - name: Upload validated OCI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-${{ matrix.name }}-${{ matrix.arch }}
          path: out/oci/
          retention-days: 7
          if-no-files-found: error
      - name: Retain failed scan evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-scan-${{ matrix.name }}-${{ matrix.arch }}
          path: out/oci/security/
          retention-days: 14
          if-no-files-found: warn

  gate:
    name: required-checks
    if: always()
    needs: [policy, catalog, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require policy, catalog, and every image build
        env:
          POLICY: ${{ needs.policy.result }}
          CATALOG: ${{ needs.catalog.result }}
          IMAGE: ${{ needs.image.result }}
        run: test "$POLICY" = success && test "$CATALOG" = success && test "$IMAGE" = success
